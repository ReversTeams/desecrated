name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Server Pack release
        run: |
          zip -r9 desecrated-server.zip . -x ".git/*" "*.sh"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: desecrated-server.zip
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}