	#Enable invulnerability for players while they're choosing their difficulty
	enableSetupImmunity = true
	#Prevent incoming damage during the difficulty selection.
	preventSetupDamage = true
	#Regularly extinguish players.
	clearSetupFire = true
	#Reset accumulated fall distance.
	resetSetupFall = true
	#Regularly max out player oxygen level.
	maxSetupAir = true
	#Keep food level maxed out.
	maxSetupFood = true
	#Keep player health max.
	maxSetupHealth = true

