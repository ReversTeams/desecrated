
[general]
	entityBlacklist = ["minecraft:armor_stand", "minecraft:painting", "minecraft:item_frame", "minecraft:glow_item_frame"]
	applyToBosses = false
	difficultyOrder = ["cozy", "normal", "extreme", "torture"]
	debugMode = false
	#Automatically select a difficulty at world start without showing the GUI
	autoSelectDifficulty = false
	#The default difficulty ID to auto-select if autoSelectDifficulty is true
	defaultAutoDifficulty = "normal"
	vengefulEntityBlacklist = []

[mechanics]
	enableBleeding = true
	enableCrippling = true
	#Range: 0.0 ~ 1.0
	bleedingChance = 0.1
	#Range: 0.0 ~ 1.0
	cripplingChance = 0.2
	#Range: 20 ~ 1200
	bleedingDuration = 100
	#Range: 20 ~ 1200
	cripplingDuration = 200
	enableVengefulAI = true
	#Range: 0.1 ~ 3.0
	vengefulSpeed = 1.25
	#Range: 4.0 ~ 64.0
	vengefulAggroRange = 16.0
	#Range: 0 ~ 100
	vengefulAttackCooldown = 20
	#Range: 0.5 ~ 20.0
	vengefulDamage = 2.0
	vengefulAffectBabyAnimals = false

[cozy]
	enabled = true
	name = "Cozy"
	recommendation = "For a relaxing, stress-free experience"
	#Range: 0.1 ~ 100.0
	hpMultiplier = 0.5
	#Range: 0.1 ~ 100.0
	dmgMultiplier = 0.5
	#Range: 0.0 ~ 100.0
	fallDmgMultiplier = 0.5
	enableRegen = true
	#Range: 0.1 ~ 100.0
	regenAmount = 0.5
	#Range: 1 ~ 1200
	regenSpeed = 40
	underwaterBreathing = true
	bgColor = "#050F0F"
	accentColor = "#55FFFF"
	allowKeepInventory = true

[normal]
	enabled = true
	name = "Normal"
	recommendation = "Recommended for first-time players"
	#Range: 0.1 ~ 100.0
	hpMultiplier = 1.0
	#Range: 0.1 ~ 100.0
	dmgMultiplier = 1.0
	#Range: 0.0 ~ 100.0
	fallDmgMultiplier = 1.0
	bgColor = "#07070F"
	accentColor = "#D4A843"
	allowKeepInventory = true

[extreme]
	enabled = true
	name = "Extreme"
	recommendation = "For experienced players seeking a challenge"
	#Range: 0.1 ~ 100.0
	hpMultiplier = 2.0
	#Range: 0.1 ~ 100.0
	dmgMultiplier = 1.5
	#Range: 0.0 ~ 100.0
	fallDmgMultiplier = 2.0
	bgColor = "#0F0A05"
	accentColor = "#FF8833"
	allowKeepInventory = true

[torture]
	enabled = true
	name = "Torture"
	recommendation = "Only for masochists. You've been warned."
	#Range: 0.1 ~ 100.0
	hpMultiplier = 3.0
	#Range: 0.1 ~ 100.0
	dmgMultiplier = 2.0
	#Range: 0.0 ~ 100.0
	fallDmgMultiplier = 3.0
	#Range: 0.0 ~ 100.0
	lifestealAmount = 1.0
	#Range: 0.0 ~ 40.0
	exhaustionAmount = 0.5
	bgColor = "#100505"
	accentColor = "#FF3333"
	allowKeepInventory = true

[chaos]
	enabled = true
	name = "Chaos"
	recommendation = "Beyond mortal comprehension."
	#Range: 0.1 ~ 100.0
	hpMultiplier = 5.0
	#Range: 0.1 ~ 100.0
	dmgMultiplier = 3.0
	#Range: 0.0 ~ 100.0
	fallDmgMultiplier = 5.0
	#Range: 0.0 ~ 100.0
	lifestealAmount = 2.0
	#Range: 0.0 ~ 40.0
	exhaustionAmount = 1.0
	bgColor = "#0A0005"
	accentColor = "#FF0000"
	allowKeepInventory = true

