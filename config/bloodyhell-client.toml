
["Accessibility Settings"]
	#Enable or disable camera shaking effects (Turn off if you experience motion sickness).
	enableCameraShake = true
	#Enable or disable dynamic FOV changes caused by mod items and effects.
	enableFovEffects = true

["Mod Tooltips Settings"]
	#True if you want to disable the red mod name and icon on bloody hell!'s items
	disable_mod_tooltips = true

["Bone Effects Settings"]
	#Master switch of the visual bone effects: shaking and breaking bones, severed pieces and the implosion. They only change how entities are drawn on your screen. Turn it off if you see glitches with other mods.
	enableBoneEffects = true
	#Let the bone effects also act on entities of other mods. On by default; turn it off, or list the entity in excludedEntities, if an entity of another mod looks wrong.
	affectOtherModsEntities = true
	#Entity ids that never get bone effects, for example ["examplemod:dragon"].
	excludedEntities = []

["Frenzy Eyes Settings"]
	#Where the golden eyes of high Frenzy sit on YOUR skin; other players see your choice. VANILLA: eyes of 2x1 pixels on the 5th row of the face (Steve, Alex). ANIME: eyes of 2x2 pixels on the 6th and 7th rows (big anime style eyes). OFF: your eyes never glow.
	#Allowed Values: VANILLA, ANIME, OFF
	frenzyEyeShape = "VANILLA"
	#Show the golden eyes of high Frenzy on players and mobs on your screen.
	showFrenzyEyes = true

