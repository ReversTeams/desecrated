["Apostle Settings"]
	#Callback Apostle feature - enables pre-nerf apostle abilities (default: true)
	callbackApostle = true
	#Allow Apostles to summon armored Zombie Piglin Brutes (default: false)
	apostleSummonArmoredZombiePiglin = false
