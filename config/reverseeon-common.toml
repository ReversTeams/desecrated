
[storm]
	#Base chance for The Storm to spawn on its once-per-day dusk roll (0.0 - 1.0).
	#Range: 0.0 ~ 1.0
	dailyChance = 0.0
	#Extra daily chance added when Vertin is on the island.
	#Range: 0.0 ~ 1.0
	vertinBonus = 0.5
	#How long The Storm lasts, in ticks (20 ticks = 1 second). Default 3600 = 3 min.
	#Range: 20 ~ 720000
	durationTicks = 3600
	#HP damage per hit at the START of the storm (before armor reduction).
	#Range: 0.0 ~ 100.0
	damageMin = 0.5
	#HP damage per hit at the END of the storm (scales up over time).
	#Range: 0.0 ~ 100.0
	damageMax = 3.0
	#Tick at which the storm enters Phase 2.
	#Range: 0 ~ 720000
	phase2Tick = 1200
	#Tick at which the storm enters Phase 3.
	#Range: 0 ~ 720000
	phase3Tick = 2400
	#Storm-damage reduction per Arcanist armor piece worn (0.20 = 20%, capped at 80%).
	#Range: 0.0 ~ 0.25
	armorReductionPerPiece = 0.2

[arcanist]
	#Maximum Arcanist level.
	#Range: 1 ~ 10000
	maxLevel = 100
	#EXP required per level.
	#Range: 1 ~ 1000000
	expPerLevel = 100
	#Iron's Spellbooks spell power granted per level while aura is active (0.0125 = +1.25%/lvl).
	#Range: 0.0 ~ 1.0
	spellPowerPerLevel = 0.0125
	#Spell-power cap as a fraction (1.25 = +125%).
	#Range: 0.0 ~ 100.0
	spellPowerCap = 1.25
	#Mana-regen bonus per level (0.0025 = +0.25%/lvl).
	#Range: 0.0 ~ 1.0
	manaRegenPerLevel = 0.0025
	#Mana-regen cap as a fraction (0.35 = +35%).
	#Range: 0.0 ~ 100.0
	manaRegenCap = 0.35

	[arcanist.exp_sources]
		#EXP gained per Storm damage tick (every 2s) while you are out in it.
		#Range: 0 ~ 10000
		stormHitExp = 1
		#Multiply Storm-hit EXP by the storm phase (1/2/3) while aura is active.
		stormPhaseScalesExp = true
		#Storm-EXP multiplier when a Vertin Hat is worn nearby (does not stack).
		#Range: 0.0 ~ 100.0
		vertinHatExpMultiplier = 2.0
		#Extra Storm-EXP fraction while a Gold aura is active (0.25 = +25%).
		#Range: 0.0 ~ 100.0
		goldAuraExpBonus = 0.25
		#EXP per 1 mana spent casting Iron's Spellbooks spells. 0 = disabled.
		#Range: 0.0 ~ 100.0
		spellCastExpPerMana = 0.0
		#EXP for killing a mob while your aura is active. 0 = disabled.
		#Range: 0 ~ 10000
		auraMobKillExp = 0
		#EXP for killing a Storm-spawned mob. 0 = disabled.
		#Range: 0 ~ 10000
		stormMobKillExp = 0
		#Bonus EXP awarded when you survive a Storm to its end. 0 = disabled.
		#Range: 0 ~ 100000
		stormSurviveExp = 0
		#Storm-EXP multiplier while sheltered (Equilibrium Umbrella / Hofmann Knot).
		#Sheltering used to award ZERO exp, which meant the only way to level was to
		#stand in the Storm and get hurt - the mod's own shelter items cost you all
		#progression. 0.4 keeps the risk/reward choice real without punishing good play.
		#Set to 0.0 for the old behaviour.
		#Range: 0.0 ~ 1.0
		shelterExpMultiplier = 0.4

[aura]
	#Level at which the aura unlocks (also needs attunement at Sonetto).
	#Range: 1 ~ 10000
	unlockLevel = 50
	#Aura duration (ticks) at the unlock level.
	#Range: 20 ~ 720000
	durationLv50 = 2400
	#Aura duration (ticks) at Lv.75+.
	#Range: 20 ~ 720000
	durationLv75 = 3600
	#Aura duration (ticks) at max level.
	#Range: 20 ~ 720000
	durationLv100 = 4300
	#Base aura cooldown in ticks (18000 = 15 min). Every colour uses this one number;
	#the per-colour extras were removed so the wait is the same whatever you rolled.
	#Range: 20 ~ 720000
	cooldownBaseTicks = 8400
	#Max cooldown reduction in SECONDS from levels (1s per level).
	#Range: 0 ~ 100000
	cooldownReductionCapSeconds = 90
	#Extra cooldown reduction in seconds while Vertin is on the island.
	#Range: 0 ~ 100000
	vertinCooldownReductionSeconds = 5
	#Extra cooldown reduction in seconds while Druvis is on the island.
	#Range: 0 ~ 100000
	druvisCooldownReductionSeconds = 10
	#Movement-speed bonus while aura active (0.25 = +25%).
	#Range: 0.0 ~ 10.0
	moveSpeedBonus = 0.25
	#HP-regen multiplier while aura active.
	#Range: 1 ~ 100
	hpRegenMultiplier = 2
	#Range (blocks) the Verdant aura shares its x2 regen with allies.
	#Range: 0.0 ~ 256.0
	verdantRange = 10.0
	#Chance to roll a special aura colour (0.10 = 10%).
	#Range: 0.0 ~ 1.0
	specialRollChance = 0.1
	#Added special-roll chance while Matilda is on the island.
	#Range: 0.0 ~ 1.0
	matildaRollBonus = 0.05
	#Aura spell power ramps up the longer it stays active, up to this extra fraction
	#(0.20 = up to +20% at the end of the aura). 0 = disabled (no ramp).
	#Range: 0.0 ~ 10.0
	spellPowerRampMax = 0.0
	#Arcanist level needed for the Ego aura, on top of having worn every other colour.
	#Setting this above the level cap makes Ego unobtainable.
	#Range: 1 ~ 1000
	egoLevelRequired = 100
	#Requiem: one heart is lost every this many ticks (100 = 5s). It never kills you.
	#Range: 20 ~ 2400
	requiemBleedTicks = 100
	#Ink: how often a mob loses your trail, in ticks (100 = 5s).
	#Range: 20 ~ 2400
	inkForgetTicks = 100

[onboarding]
	#Give the Tome of the Eon (and show its welcome chat message) on a player's first join.
	#Disable for packs where Reverse Eon isn't the starting point and the Tome is meant
	#to be crafted later — the auto-gift would feel out of place there.
	#NOTE: this covers the TOME ONLY. The Timekeeper Suitcase has its own switch below.
	giveTomeOnJoin = false
	#Give the one-per-world Timekeeper Suitcase (and show its chat message) to the first
	#player who joins.
	#
	#This gift used to be hardcore-only, so in every other world it simply never happened and
	#there was nothing to switch off. It now runs in every game mode -- which meant a pack that
	#had turned giveTomeOnJoin off still got a free item and a [The Storm] chat line on join,
	#with no setting anywhere that stopped it. Hence this switch.
	giveSuitcaseOnJoin = false

[affinity]
	#Maximum affinity per NPC, per player.
	#Range: 1 ~ 1000000
	maxPoints = 1000
	#Affinity each conversation answer is worth. A good answer moves the bond by this much,
	#a poor one by the same again (or double, for the worst answer of each question).
	#Range: 0 ~ 100000
	talkAmount = 1
	#Cooldown between conversations, in seconds. 150 = 2:30.
	#Range: 0 ~ 86400
	talkCooldownSeconds = 60
	#Affinity gained when gifting a flower.
	#Range: 0 ~ 100000
	flowerAmount = 10
	#Cooldown between flower gifts, in seconds. 210 = 3:30.
	#Range: 0 ~ 86400
	flowerCooldownSeconds = 120
	#Affinity LOST when gifting a Wither Rose (positive number).
	#Range: 0 ~ 100000
	witherAmount = 10
	#Arcanist EXP granted per point of affinity gained.
	#Range: 0 ~ 100000
	expPerPoint = 5
	#Affinity needed to unlock an NPC's first passive.
	#The passive ids (e.g. "vertin_400") keep their original numbers whatever you set here:
	#those numbers identify WHICH passive, not what it costs, and they are written into
	#player save data. Changing this moves the threshold, not the id.
	#Range: 0 ~ 1000000
	tier1 = 400
	#Affinity needed to unlock an NPC's second passive. See tier1.
	#Range: 0 ~ 1000000
	tier2 = 800
	#Sonetto's 400 bond passive: added spell damage, as a fraction (0.10 = +10%).
	#The passive also stops the holder damaging another player at all -- melee,
	#arrows and spells alike. That half is not tunable; it is the point of the oath.
	#Range: 0.0 ~ 10.0
	sonettoSpellDamage = 0.1
	#Affinity gained per tier of a Wrapped Keepsake. A tier-3 gift is worth three times this.
	#The tier comes from what was sealed inside -- iron 1, diamond 3, Dragon Egg 5 (clamped).
	#Range: 0 ~ 100000
	keepsakeAmountPerTier = 25
	#Cooldown between Wrapped Keepsake gifts, in seconds. 1800 = 30 minutes.
	#This is its OWN cooldown, deliberately not shared with flowers: a keepsake costs a real
	#item and pays several times a flower, so putting both on one timer would mean a flower
	#given in passing locks out the half-hour gift, and nothing on screen would say why.
	#Range: 0 ~ 86400
	keepsakeCooldownSeconds = 1800

[suitcase]
	#Starting number of boxes a Suitcase Tablet network can link.
	#Range: 1 ~ 100000
	defaultBoxCap = 50
	#Maximum box cap reachable via Master Card upgrades.
	#Range: 1 ~ 100000
	maxBoxCap = 1000
	#Box cap added per Master Card inserted into an unlocked Computer Suitcase.
	#Range: 1 ~ 100000
	capPerCard = 50
	#Real minutes to install a Suitcase Tablet from a Computer (0 = instant).
	#Range: 0 ~ 1440
	installMinutes = 10
	#Seconds of install progress added per press of the tablet's Add Time button.
	#Range: 1 ~ 86400
	addTimeSeconds = 60
	#Cooldown, in seconds, between NPC summons from the tablet (0 = no cooldown).
	#Range: 0 ~ 86400
	summonCooldownSeconds = 30
	#Let a player shift + right-click an animal with the Timekeeper Suitcase to send it
	#to the island dock. Only animals, and only ones nobody else has tamed.
	#Set false to keep the suitcase strictly a doorway for people.
	ferryAnimals = true
	#Suitcase Tablet crafting panel (craft / smelt from the storage network).
	#The panel needs a linked Crafting Table; other stations only add processes
	#to a panel the table has already opened.
	#Set false to switch it off - the tab then does not appear at all, rather
	#than appearing and refusing every click.
	#Note: queued smelting jobs from an earlier session always finish and their
	#results are returned, even while this is false - their ingredients were
	#already taken and are not thrown away.
	craftingEnabled = true

#Storm monsters - skeletons and zombies the Storm is eating.
[stormMonsters]
	#Spawn Storm Syndrome Skeletons and Zombies while the Storm is blowing.
	enabled = true
	#Iron's Spellbooks spell id the Storm Skeleton casts (every 10s).
	#Ignored when Iron's Spellbooks is not installed - the monster still spawns,
	#it simply has no spell. An id that does not exist behaves the same way.
	skeletonSpell = "irons_spellbooks:gust"
	#Iron's Spellbooks spell id the Storm Zombie casts (every 10s).
	zombieSpell = "irons_spellbooks:throw"

#Forget Me Not - the potion-throwing mini boss.
[forgetMeNot]
	#Iron's Spellbooks spell id Forget Me Not casts to reposition (every 12s).
	#Blood Step is a short teleport, which is what makes it hard to corner.
	#Ignored when Iron's Spellbooks is not installed - it then fights with
	#potions and melee only, which is still a complete encounter.
	spell = "irons_spellbooks:blood_step"

[island]
	#Let a Warp Pad be set as the island's shared arrival point (sneak + right-click).
	#Anyone without a pad of their own lands there instead of at the dock.
	#A personal pad always wins over the shared one.
	sharedWarpPad = true
	#Require permission level 2 to set or clear the shared pad.
	#On an open server this is the difference between a front door and a way for
	#anyone to decide where everybody else materialises.
	sharedWarpPadOpOnly = true
	#Allow Nether portals to be lit on the island.
	#Off: flint and steel refuses on the island and says so, rather than failing quietly.
	#Portals that already exist keep working either way.
	netherPortals = false
	#Allow End portal frames to be filled with eyes of ender on the island.
	#Off: the eye will not go in, and the player is told why.
	endPortals = false
	#Take fall damage on the island.
	#Off by default: it is a building space reached through a suitcase, and dying to
	#your own scaffolding there is not the danger anyone came for.
	fallDamage = false

[wishing_orb]
	#How long after a wish before the same player may wish again, in seconds. 240 = 4 minutes.
	#This is a cooldown on the PLAYER, not on the item stack: carrying several orbs does not
	#buy several wishes at once. Set to 0 to remove the wait entirely.
	#Note that lowering this does not shorten a wait already running -- the stored timestamp
	#is compared against the new number, so an existing wait simply ends sooner.
	#Range: 0 ~ 86400
	cooldownSeconds = 240
	#Affinity granted with EACH islander by the fourth wish, 'Let them think well of me'.
	#The default 50 is five flowers' worth per character and about a third of the way to the
	#first passive tier. Raising it far past this makes the orb the fastest bond in the mod,
	#which is a fine choice to make deliberately and a bad one to make by accident.
	#Range: 0 ~ 1000000
	regardAmount = 50

[year]
	#Let the Storm change the year when it passes.
	#Off: the year stays where it is and no cutscene plays. The year itself is still
	#saved and still shown, so turning this back on resumes from the same number.
	enabled = true
	#Damage immunity granted to every player while the year cutscene plays, in ticks.
	#A Screen only pauses the game in single-player. On a server everyone stands still
	#watching an animation they cannot escape, so this is what stops that being a
	#free hit. Set it to 0 to remove the protection.
	#Range: 0 ~ 1200
	cutsceneImmunityTicks = 140

#The Storm's world revert.
[worldRevert]
	#Surviving a Storm returns the Overworld to the state it generated in.
	#Builds, mined blocks and every other trace of habitation are undone as
	#each chunk is next visited. The seed does not change, so the land itself
	#is the same land.
	#IRREVERSIBLE - every Overworld build is lost, by design.
	#Works in singleplayer, LAN and on servers alike. OFF by default.
	enabled = false

