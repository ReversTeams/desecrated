
[storm]
	#Base chance for The Storm to spawn on its once-per-day dusk roll (0.0 - 1.0).
	#Range: 0.0 ~ 1.0
	dailyChance = 0.0
	#Extra daily chance added when Vertin is on the island.
	#Range: 0.0 ~ 1.0
	vertinBonus = 0.5
	#How long The Storm lasts, in ticks (20 ticks = 1 second). Default 3600 = 3 min.
	#Range: 20 ~ 720000
	durationTicks = 3600
	#HP damage per hit at the START of the storm (before armor reduction).
	#Range: 0.0 ~ 100.0
	damageMin = 0.5
	#HP damage per hit at the END of the storm (scales up over time).
	#Range: 0.0 ~ 100.0
	damageMax = 3.0
	#Tick at which the storm enters Phase 2.
	#Range: 0 ~ 720000
	phase2Tick = 1200
	#Tick at which the storm enters Phase 3.
	#Range: 0 ~ 720000
	phase3Tick = 2400
	#Storm-damage reduction per Arcanist armor piece worn (0.20 = 20%, capped at 80%).
	#Range: 0.0 ~ 0.25
	armorReductionPerPiece = 0.2

[arcanist]
	#Maximum Arcanist level.
	#Range: 1 ~ 10000
	maxLevel = 100
	#EXP required per level.
	#Range: 1 ~ 1000000
	expPerLevel = 100
	#Iron's Spellbooks spell power granted per level while aura is active (0.0125 = +1.25%/lvl).
	#Range: 0.0 ~ 1.0
	spellPowerPerLevel = 0.0125
	#Spell-power cap as a fraction (1.25 = +125%).
	#Range: 0.0 ~ 100.0
	spellPowerCap = 1.25
	#Mana-regen bonus per level (0.0025 = +0.25%/lvl).
	#Range: 0.0 ~ 1.0
	manaRegenPerLevel = 0.0025
	#Mana-regen cap as a fraction (0.35 = +35%).
	#Range: 0.0 ~ 100.0
	manaRegenCap = 0.35

	[arcanist.exp_sources]
		#EXP gained per Storm damage tick (every 2s) while you are out in it.
		#Range: 0 ~ 10000
		stormHitExp = 1
		#Multiply Storm-hit EXP by the storm phase (1/2/3) while aura is active.
		stormPhaseScalesExp = true
		#Storm-EXP multiplier when a Vertin Hat is worn nearby (does not stack).
		#Range: 0.0 ~ 100.0
		vertinHatExpMultiplier = 2.0
		#Extra Storm-EXP fraction while a Gold aura is active (0.25 = +25%).
		#Range: 0.0 ~ 100.0
		goldAuraExpBonus = 0.25
		#EXP per 1 mana spent casting Iron's Spellbooks spells. 0 = disabled.
		#Range: 0.0 ~ 100.0
		spellCastExpPerMana = 0.0
		#EXP for killing a mob while your aura is active. 0 = disabled.
		#Range: 0 ~ 10000
		auraMobKillExp = 0
		#EXP for killing a Storm-spawned mob. 0 = disabled.
		#Range: 0 ~ 10000
		stormMobKillExp = 0
		#Bonus EXP awarded when you survive a Storm to its end. 0 = disabled.
		#Range: 0 ~ 100000
		stormSurviveExp = 0
		#Storm-EXP multiplier while sheltered (Equilibrium Umbrella / Hofmann Knot).
		#Sheltering used to award ZERO exp, which meant the only way to level was to
		#stand in the Storm and get hurt - the mod's own shelter items cost you all
		#progression. 0.4 keeps the risk/reward choice real without punishing good play.
		#Set to 0.0 for the old behaviour.
		#Range: 0.0 ~ 1.0
		shelterExpMultiplier = 0.4

[aura]
	#Level at which the aura unlocks (also needs attunement at Sonetto).
	#Range: 1 ~ 10000
	unlockLevel = 50
	#Aura duration (ticks) at the unlock level.
	#Range: 20 ~ 720000
	durationLv50 = 2400
	#Aura duration (ticks) at Lv.75+.
	#Range: 20 ~ 720000
	durationLv75 = 3600
	#Aura duration (ticks) at max level.
	#Range: 20 ~ 720000
	durationLv100 = 4300
	#Base aura cooldown in ticks (8400 = 7 min).
	#Range: 20 ~ 720000
	cooldownBaseTicks = 8400
	#Max cooldown reduction in SECONDS from levels (1s per level).
	#Range: 0 ~ 100000
	cooldownReductionCapSeconds = 90
	#Extra cooldown reduction in seconds while Vertin is on the island.
	#Range: 0 ~ 100000
	vertinCooldownReductionSeconds = 5
	#Extra cooldown reduction in seconds while Druvis is on the island.
	#Range: 0 ~ 100000
	druvisCooldownReductionSeconds = 10
	#Movement-speed bonus while aura active (0.25 = +25%).
	#Range: 0.0 ~ 10.0
	moveSpeedBonus = 0.25
	#HP-regen multiplier while aura active.
	#Range: 1 ~ 100
	hpRegenMultiplier = 2
	#Range (blocks) the Verdant aura shares its x2 regen with allies.
	#Range: 0.0 ~ 256.0
	verdantRange = 10.0
	#Chance to roll a special aura colour (0.10 = 10%).
	#Range: 0.0 ~ 1.0
	specialRollChance = 0.1
	#Added special-roll chance while Matilda is on the island.
	#Range: 0.0 ~ 1.0
	matildaRollBonus = 0.05
	#Aura spell power ramps up the longer it stays active, up to this extra fraction
	#(0.20 = up to +20% at the end of the aura). 0 = disabled (no ramp).
	#Range: 0.0 ~ 10.0
	spellPowerRampMax = 0.0

[onboarding]
	#Give the Tome of the Eon (and show its welcome chat message) on a player's first join.
	#Disable for packs where Reverse Eon isn't the starting point and the Tome is meant
	#to be crafted later — the auto-gift would feel out of place there.
	#NOTE: this covers the TOME ONLY. The Timekeeper Suitcase has its own switch below.
	giveTomeOnJoin = false
	#Give the one-per-world Timekeeper Suitcase (and show its chat message) to the first
	#player who joins.
	#
	#This gift used to be hardcore-only, so in every other world it simply never happened and
	#there was nothing to switch off. It now runs in every game mode -- which meant a pack that
	#had turned giveTomeOnJoin off still got a free item and a [The Storm] chat line on join,
	#with no setting anywhere that stopped it. Hence this switch.
	giveSuitcaseOnJoin = true

[affinity]
	#Maximum affinity per NPC, per player.
	#Range: 1 ~ 1000000
	maxPoints = 1000
	#Affinity each conversation answer is worth. A good answer moves the bond by this much,
	#a poor one by the same again (or double, for the worst answer of each question).
	#Range: 0 ~ 100000
	talkAmount = 1
	#Cooldown between conversations, in seconds.
	#Range: 0 ~ 86400
	talkCooldownSeconds = 60
	#Affinity gained when gifting a flower.
	#Range: 0 ~ 100000
	flowerAmount = 10
	#Cooldown between flower gifts, in seconds.
	#Range: 0 ~ 86400
	flowerCooldownSeconds = 120
	#Affinity LOST when gifting a Wither Rose (positive number).
	#Range: 0 ~ 100000
	witherAmount = 10
	#Arcanist EXP granted per point of affinity gained.
	#Range: 0 ~ 100000
	expPerPoint = 5
	#Affinity needed to unlock an NPC's first passive.
	#The passive ids (e.g. "vertin_400") keep their original numbers whatever you set here:
	#those numbers identify WHICH passive, not what it costs, and they are written into
	#player save data. Changing this moves the threshold, not the id.
	#Range: 0 ~ 1000000
	tier1 = 400
	#Affinity needed to unlock an NPC's second passive. See tier1.
	#Range: 0 ~ 1000000
	tier2 = 800

[suitcase]
	#Starting number of boxes a Suitcase Tablet network can link.
	#Range: 1 ~ 100000
	defaultBoxCap = 50
	#Maximum box cap reachable via Master Card upgrades.
	#Range: 1 ~ 100000
	maxBoxCap = 1000
	#Box cap added per Master Card inserted into an unlocked Computer Suitcase.
	#Range: 1 ~ 100000
	capPerCard = 50
	#Real minutes to install a Suitcase Tablet from a Computer (0 = instant).
	#Range: 0 ~ 1440
	installMinutes = 10
	#Seconds of install progress added per press of the tablet's Add Time button.
	#Range: 1 ~ 86400
	addTimeSeconds = 60
	#Cooldown, in seconds, between NPC summons from the tablet (0 = no cooldown).
	#Range: 0 ~ 86400
	summonCooldownSeconds = 30
	#Let a player shift + right-click an animal with the Timekeeper Suitcase to send it
	#to the island dock. Only animals, and only ones nobody else has tamed.
	#Set false to keep the suitcase strictly a doorway for people.
	ferryAnimals = true

