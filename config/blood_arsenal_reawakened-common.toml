	#Range: 0 ~ 10
	chestplate_haste_level = 2
	#Range: 0 ~ 10
	leggings_speed_level = 2
	#Range: 0 ~ 10
	full_set_strength_level = 1
	#Range: 0 ~ 10
	full_set_regeneration_level = 1
	#Range: 0 ~ 10
