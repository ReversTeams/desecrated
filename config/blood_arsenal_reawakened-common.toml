
[weapons]
	#Bonus attack damage of the Blood-Bound Executioner (on top of the Netherite base)
	#Range: 0 ~ 2048
	blood_bound_executioner_damage = 7
	#Range: -4.0 ~ 4.0
	blood_bound_executioner_speed = -2.4
	#Bonus attack damage of the Sanguine Scythe (on top of the Diamond base)
	#Range: 0 ~ 2048
	sanguine_scythe_damage = 6
	#Range: -4.0 ~ 4.0
	sanguine_scythe_speed = -2.4
	#The Executioner finishes a target whose health would drop below this fraction of its maximum.
	#Set to 0 to disable the execute entirely.
	#Range: 0.0 ~ 1.0
	execute_health_threshold = 0.2
	#Targets with a higher maximum health than this cannot be executed.
	#This is what keeps bosses (vanilla and modded) out of the instant-kill.
	#Range: 0.0 ~ 100000.0
	execute_max_target_max_health = 100.0
	#Whether the execute may trigger on other players.
	execute_allow_players = false
	#LP added to your network on a successful execute. Respects your Blood Orb capacity.
	#Range: > 0
	execute_lp_gain = 500
	#Range: > 0
	blood_spear_lp_cost = 1500
	#Range: 0.0 ~ 10000.0
	blood_spear_damage = 15.0
	#Range: 1.0 ~ 128.0
	blood_spear_range = 20.0
	#Range: 0 ~ 600
	blood_spear_burn_seconds = 3
	#Cooldown in ticks (20 ticks = 1 second)
	#Range: 0 ~ 72000
	blood_spear_cooldown = 30
	#LP harvested per kill. Respects your Blood Orb capacity.
	#Range: > 0
	sanguine_scythe_lp_per_kill = 100
	#Range: 0.0 ~ 10000.0
	blood_vortex_damage = 8.0
	#Range: 1.0 ~ 32.0
	blood_vortex_radius = 5.0
	#Damage the Blood Vortex costs its wielder. It can never drop you below half a heart.
	#Range: 0.0 ~ 1000.0
	blood_vortex_self_damage = 2.0
	#Range: 0 ~ 72000
	blood_vortex_cooldown = 100

[sigils]
	#The Divinity Sigil is the endgame item: while active it eats incoming damage outright.
	#It is no longer a permanent invulnerability flag - every point of damage is paid for in LP,
	#and the sigil shuts itself off the moment your network cannot cover the bill.
	#Range: > 0
	divinity_activation_lp = 1000000
	#LP drained per second just for keeping the sigil lit.
	#Range: > 0
	divinity_upkeep_per_tick = 3500
	#Range: > 0
	flight_lp_per_tick = 20
	#Actual cost scales as base x level^2
	#Range: > 0
	lightning_base_cost = 500
	#Range: > 0
	bloodmoon_time_change = 5000
	#Range: > 0
	decayed_blood_save = 5000
	#Range: > 0
	decayed_blood_teleport = 5000
	#Range: > 0
	ender_teleport = 250
	#Range: > 0
	ender_chest = 100
	#Range: > 0
	bloodlust_activation = 30000
	#Additional LP burned per point of damage absorbed.
	#0 means the sigil costs only its activation and upkeep, no matter how much it swallows.
	#Range: > 0
	divinity_lp_per_damage_absorbed = 0
	#Damage above this value in a single hit still gets through, no matter how much LP you have.
	#Set very high to make the sigil a true god-mode.
	#Range: 0.0 ~ 1000000.0
	divinity_max_absorbed_per_hit = 1000.0
	#Effect levels: 0 = disabled, 1 = I, 2 = II, ...
	#Range: 0 ~ 10
	divinity_resistance_level = 5
	#Range: 0 ~ 10
	divinity_regeneration_level = 2
	divinity_keeps_you_fed = true
	#Range: > 0
	flight_minimum_lp_to_activate = 100
	#Range: 1 ~ 10
	lightning_max_level = 5
	#Set to false to make the summoned bolts purely cosmetic in terms of block damage.
	lightning_starts_fires = true
	#Range: 0 ~ 72000
	bloodmoon_cooldown = 100
	#Range: 1.0 ~ 256.0
	ender_range = 64.0
	#Range: 1 ~ 720000
	bloodlust_power_ticks = 6000
	#Range: 0 ~ 720000
	bloodlust_crash_ticks = 1200
	#Range: 0 ~ 720000
	bloodlust_cooldown_ticks = 36000
	#Effect levels granted during the power phase. 0 = disabled, 1 = I, 2 = II, ...
	#Careful with resistance: vanilla treats level 5 and above as total immunity to damage,
	#which makes the Bloodlust Sigil strictly better than the Divinity Sigil for a fraction of the cost.
	#Range: 0 ~ 10
	bloodlust_strength_level = 4
	#Range: 0 ~ 10
	bloodlust_resistance_level = 3
	#Range: 0 ~ 10
	bloodlust_regeneration_level = 3
	#Range: 0 ~ 10
	bloodlust_speed_level = 3
	#Range: 0 ~ 10
	bloodlust_jump_level = 2
	bloodlust_saturation = true
	#Effect levels during the crash phase - the price of the power phase.
	#Range: 0 ~ 10
	bloodlust_weakness_level = 3
	#Range: 0 ~ 10
	bloodlust_slowness_level = 3
	#Range: 0 ~ 10
	bloodlust_mining_fatigue_level = 3

[hearts]
	#Health (HP) granted per heart consumed; 2.0 = one heart
	#Range: 0.0 ~ 100.0
	health_per_heart = 2.0
	#Range: 0 ~ 1000
	max_uses_per_type = 10
	#Damage dealt when you try to eat a heart past the limit. 0 disables the punishment.
	#Range: 0 ~ 1000
	overeat_damage = 10
	#The three heart rituals. Each is started by sneak-right-clicking with the catalyst
	#while the offerings lie on the ground around you.
