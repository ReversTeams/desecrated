	#Range: 0.0 ~ 1.0
	crimson_ritual_max_health_fraction = 0.5
	#Range: 0 ~ 3600
	crimson_ritual_wither_seconds = 30
	#Range: > 0
	sanguine_ritual_lp = 100000
	#Range: 20 ~ 72000
	sanguine_ritual_ticks = 300
	#How many adult animals the Rite of the Stolen Pulse consumes.
	#Range: 1 ~ 64
	sanguine_ritual_animals = 3
	#Range: > 0
	ascension_ritual_lp = 250000
	#Range: 20 ~ 72000
	ascension_ritual_ticks = 400

