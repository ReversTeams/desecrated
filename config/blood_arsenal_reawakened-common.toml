	full_set_fire_resistance = true
	full_set_saturation = true
	full_set_water_breathing = true
	full_set_negates_fall_damage = true
	#What the full set does to your maximum health.
	#SET  - clamps it to exactly full_set_health_value, whatever else you have eaten (the glass-cannon build).
	#ADD  - adds full_set_health_value on top of your normal maximum.
	#NONE - leaves your health alone.
	#Allowed Values: NONE, ADD, SET
	full_set_health_mode = "SET"
	#Health value used by full_set_health_mode. 2.0 = one heart, so 4.0 is two hearts.
	#Range: 1.0 ~ 1024.0
	full_set_health_value = 4.0
	#How often (in ticks) the boots freeze the water below you.
	#Range: 1 ~ 200
	boots_frost_walker_interval = 10
	#Range: 0.0 ~ 1.0
	blood_price_damage_per_heart = 0.02
	#Range: 0.0 ~ 10.0
	blood_price_max_damage_bonus = 1.0
	#Range: 0.0 ~ 1.0
	full_set_lifesteal = 0.1
	#Range: 0.0 ~ 1024.0
	full_set_lifesteal_max_per_hit = 4.0

[rituals]
	#Total LP drained over the whole Apotheosis ritual.
	#Range: > 0
	apotheosis_total_lp = 1000000
	#Range: 0.0 ~ 1.0
	apotheosis_min_health_fraction = 0.8
	#Range: > 0
	soul_anchor_revive_lp = 200000
	#Whether the Soul Anchor is destroyed after saving you once.
	soul_anchor_consumed_on_use = true
	#How often (in ticks) dropped ritual catalysts look around for their offerings.
	#Higher values are cheaper on the server; 1 restores the old every-tick behaviour.
	#Range: 1 ~ 200
	ritual_scan_interval = 10

