[meatgun]
	# default: 0.0
	test = 0.0
	# Applied to headshots.
	# default: 1.5
	defaultBulletCritMultiplier = 1.5
	# Shot angle variation in degrees. Precision modifiers are applied to this.
	# default: 4.0
	baseShotDeviation = 4.0
	# Shot angle variation in degrees in ADS mode. Precision modifiers are applied to this.
	# default: 2.0
	baseShotDeviationAds = 2.0
	# Drill Chassis max complexity is found in neepmeat.toml
	# default: 8
	rawGunMaxComplexity = 8
	# default: 16
	pistolBaseMaxComplexity = 16
	# default: 16
	staffBaseMaxComplexity = 16
	# default: 20
	longGunBaseMaxComplexity = 20
	# default: 5.5
	pistolAttackDamage = 5.5
	# Multiplied by 5 internally
	# default: 16
	pistolCapacity = 16
	# default: 10.0
	chuggerAttackDamage = 10.0
	# Multiplied by 5 internally
	# default: 20
	chuggerCapacity = 20
	# default: 6.0
	bosherAttackDamage = 6.0
	# Multiplied by 5 internally
	# default: 16
	bosherCapacity = 16
	# default: 15.0
	longBoiBaseDamage = 15.0
	# Multiplied by 5 internally
	# default: 16
	longBoiCapacity = 16
	# default: 10.0
	grenadeLauncherDamage = 10.0
	# Multiplied by 5 internally
	# default: 16
	grenadeLauncherCapacity = 16
	# default: 4.0
	bloodThrowerDamage = 4.0
	# Multiplied by 5 internally
	# default: 48
	bloodThrowerCapacity = 48
	# default: 8.0
	halberdDamage = 8.0
	# default: 8.0
	shockStaffDamage = 8.0
	# Multiplied by 5 internally
	# default: 16
	shockStaffCapacity = 16
	# Multiplied by 5 internally
	# default: 24
	batteryCapacity = 24

# Multiplied by 5 internally
[ammunition]
	# default: 12
	smallBallisticAmount = 12
	# default: 24
	mediumBallisticAmount = 24
	# default: 48
	largeBallisticAmount = 48
	# default: 12
	smallEnergyAmount = 12
	# default: 24
	mediumEnergyAmount = 24
