
#Schools of Magic - Fairy settings
[fairies]
	#Radius in blocks within which fairy perks act on the world/entities.
	#Range: 2.0 ~ 24.0
	perk_radius = 6.0
	#Ticks between each fairy perk activation (20 ticks = 1 second).
	#Range: 20 ~ 600
	perk_cooldown = 60
	#Whether fairies may spawn naturally in the Faegrove (spawn eggs always work).
	natural_spawning = true

	#Enable or disable each fairy's perk individually.
	[fairies.perks]
		#Moonlit Fairy perk
		white = true
		#Ember Fairy perk
		orange = true
		#Bloom Fairy perk
		magenta = true
		#Sunbeam Fairy perk
		yellow = true
		#Sprout Fairy perk
		lime = true
		#Heart Fairy perk
		pink = true
		#Dust Fairy perk
		gray = true
		#Mist Fairy perk
		light_gray = true
		#Tide Fairy perk
		cyan = true
		#Arcane Fairy perk
		purple = true
		#Breeze Fairy perk
		blue = true
		#Burrow Fairy perk
		brown = true
		#Moss Fairy perk
		green = true
		#Spite Fairy perk
		red = true
		#Shadow Fairy perk
		black = true

